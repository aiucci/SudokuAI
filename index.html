<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sudoku — puzzle generator</title>
<style>
  :root {
    --paper: #f3efe6;
    --panel: #fffdf8;
    --ink: #232a31;
    --muted: #7c8593;
    --line: #dcd5c6;
    --strong-line: #8f8878;
    --accent: #b4532a;
    --accent-soft: #f6e3d8;
    --user: #1c6e6a;
    --bad: #b33424;
    --good: #2f7d4f;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    padding: 34px 20px 52px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    background: radial-gradient(1200px 620px at 12% -12%, #fbf8f0, var(--paper));
    color: var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  .shell { width: min(960px, 100%); }

  .head {
    display: flex;
    flex-wrap: wrap;
    gap: 18px;
    align-items: flex-end;
    justify-content: space-between;
    margin-bottom: 24px;
  }

  h1 {
    margin: 0 0 4px;
    font-family: ui-serif, Georgia, "Times New Roman", serif;
    font-size: clamp(2rem, 4vw, 2.6rem);
    font-weight: 600;
    letter-spacing: -0.02em;
  }

  .sub { margin: 0; color: var(--muted); font-size: 0.92rem; }

  .levels {
    display: flex;
    gap: 2px;
    padding: 4px;
    background: #faf6ec;
    border: 1px solid var(--line);
    border-radius: 999px;
  }

  .levels button {
    border: 0;
    background: transparent;
    padding: 8px 14px;
    border-radius: 999px;
    font: inherit;
    font-size: 0.85rem;
    color: var(--muted);
    cursor: pointer;
    transition: background 0.14s ease, color 0.14s ease;
  }

  .levels button:hover { color: var(--ink); }
  .levels button.is-active { background: var(--ink); color: #fdfbf5; }

  .play {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 272px;
    gap: 26px;
    align-items: start;
  }

  .board {
    display: grid;
    grid-template-columns: repeat(9, 1fr);
    grid-template-rows: repeat(9, 1fr);
    width: 100%;
    aspect-ratio: 1 / 1;
    container-type: inline-size;
    background: var(--panel);
    border: 2px solid var(--ink);
    border-radius: 8px;
    overflow: hidden;
    outline: none;
    user-select: none;
    box-shadow: 0 18px 40px -30px rgba(35, 42, 49, 0.7);
  }

  .board:focus-visible { box-shadow: 0 0 0 3px var(--accent-soft); }

  .cell {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    border-right: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    cursor: pointer;
    overflow: hidden;
    transition: background 0.12s ease;
  }

  /* 3x3 box separators, then drop the borders the board frame already draws. */
  .cell:nth-child(9n+3), .cell:nth-child(9n+6) { border-right: 2px solid var(--strong-line); }
  .cell:nth-child(n+19):nth-child(-n+27),
  .cell:nth-child(n+46):nth-child(-n+54) { border-bottom: 2px solid var(--strong-line); }
  .cell:nth-child(9n) { border-right: 0; }
  .cell:nth-child(n+73) { border-bottom: 0; }

  .value {
    font-size: 5.6cqw;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }

  .notes {
    position: absolute;
    inset: 2px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    opacity: 0;
    transition: opacity 0.1s ease;
  }

  .cell.has-notes .notes { opacity: 1; }

  .notes span {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(8px, 2.2cqw, 15px);
    line-height: 1;
    color: var(--muted);
    opacity: 0;
  }

  .notes span.on { opacity: 1; }

  .cell.is-peer { background: #f5f0e4; }
  .cell.is-same { background: var(--accent-soft); }
  .cell.is-selected { background: #f1e7d7; box-shadow: inset 0 0 0 2px var(--accent); z-index: 2; }
  .cell.is-given .value { color: var(--ink); font-weight: 600; }
  .cell.is-user .value { color: var(--user); }
  .cell.is-bad { background: #fbe6e2; }
  .cell.is-bad .value { color: var(--bad); font-weight: 700; }

  .side { display: flex; flex-direction: column; gap: 12px; }

  .meta {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 10px 14px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
  }

  .meta-label {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--muted);
  }

  .metric {
    font-variant-numeric: tabular-nums;
    font-size: 1.1rem;
    font-weight: 600;
  }

  .btn {
    font: inherit;
    font-size: 0.9rem;
    padding: 10px 14px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--panel);
    color: var(--ink);
    cursor: pointer;
    transition: background 0.14s ease, border-color 0.14s ease, transform 0.14s ease;
  }

  .btn:hover { border-color: #bdb5a3; transform: translateY(-1px); }
  .btn-primary { background: var(--ink); border-color: var(--ink); color: #fdfbf5; }
  .btn-primary:hover { background: #323b45; border-color: #323b45; }

  .pad {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .pad button {
    grid-column: span 2;
    padding: 12px 0;
    font: inherit;
    font-size: 1.05rem;
    font-variant-numeric: tabular-nums;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--panel);
    color: var(--ink);
    cursor: pointer;
    transition: background 0.14s ease;
  }

  .pad button:hover { background: #f6f0e4; }
  .pad button.wide { grid-column: span 3; font-size: 0.88rem; }
  .pad button.full { grid-column: span 6; font-size: 0.88rem; }
  #notesBtn[aria-pressed="true"],
  #autoBtn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }

  .checks { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

  .status { min-height: 2.6em; margin: 0; font-size: 0.85rem; line-height: 1.4; color: var(--muted); }
  .status.good { color: var(--good); }
  .status.bad { color: var(--bad); }

  .hint { margin: 0; font-size: 0.76rem; color: var(--muted); }

  @media (max-width: 820px) {
    body { padding: 24px 16px 40px; }
    .play { grid-template-columns: 1fr; gap: 20px; }
    .side { max-width: 520px; }
  }
</style>
</head>
<body>
<main class="shell">
  <header class="head">
    <div>
      <h1>Sudoku</h1>
      <p class="sub">A fresh puzzle every time — generated and checked for a single solution.</p>
    </div>
    <div class="levels" id="levels" role="group" aria-label="Difficulty">
      <button data-level="easy" class="is-active">Easy</button>
      <button data-level="medium">Medium</button>
      <button data-level="hard">Hard</button>
      <button data-level="expert">Expert</button>
    </div>
  </header>

  <section class="play">
    <div class="board" id="board" role="grid" aria-label="Sudoku board" tabindex="0"></div>

    <aside class="side">
      <div class="meta">
        <span class="meta-label">Time</span>
        <span class="metric" id="timer">00:00</span>
      </div>
      <div class="meta">
        <span class="meta-label">Clues</span>
        <span class="metric" id="clues">—</span>
      </div>

      <button class="btn btn-primary" id="new">New puzzle</button>

      <div class="pad" id="pad">
        <button data-digit="1">1</button>
        <button data-digit="2">2</button>
        <button data-digit="3">3</button>
        <button data-digit="4">4</button>
        <button data-digit="5">5</button>
        <button data-digit="6">6</button>
        <button data-digit="7">7</button>
        <button data-digit="8">8</button>
        <button data-digit="9">9</button>
        <button data-action="erase" class="wide">Erase</button>
        <button data-action="notes" class="wide" id="notesBtn" aria-pressed="false">Notes</button>
        <button data-action="auto" class="full" id="autoBtn" aria-pressed="false">Auto notes</button>
      </div>

      <div class="checks">
        <button class="btn" id="check">Check</button>
        <button class="btn" id="solve">Solve</button>
      </div>

      <p class="status" id="status" role="status" aria-live="polite"></p>
      <p class="hint">Tap a cell, then type 1–9. Arrow keys move, N toggles notes. In notes mode a digit removes or restores a mark, including the auto ones.</p>
    </aside>
  </section>
</main>

<script>
/*
 * Sudoku core: one backtracking search serves generation, solving and uniqueness checks.
 * Boards are flat 81-cell arrays of digits, 0 = empty.
 */
var Sudoku = (function () {
  "use strict";

  const FULL = 0x1ff;                 // one bit per digit 1-9
  const DIGITS = [1, 2, 3, 4, 5, 6, 7, 8, 9];
  const TARGET_CLUES = { easy: 45, medium: 37, hard: 31, expert: 26 };

  const POPCOUNT = new Uint8Array(512);
  for (let i = 1; i < 512; i++) POPCOUNT[i] = POPCOUNT[i >> 1] + (i & 1);

  const rowOf = (i) => Math.floor(i / 9);
  const colOf = (i) => i % 9;
  const boxOf = (i) => Math.floor(i / 27) * 3 + Math.floor((i % 9) / 3);

  // The 27 units — nine rows, nine columns, nine boxes — that every rule is built on.
  const UNITS = [];
  for (let n = 0; n < 9; n++) {
    const row = [], col = [], box = [];
    const top = Math.floor(n / 3) * 3, left = (n % 3) * 3;
    for (let k = 0; k < 9; k++) {
      row.push(n * 9 + k);
      col.push(k * 9 + n);
      box.push((top + Math.floor(k / 3)) * 9 + left + (k % 3));
    }
    UNITS.push(row, col, box);
  }

  function shuffle(list) {
    for (let i = list.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [list[i], list[j]] = [list[j], list[i]];
    }
    return list;
  }

  function countClues(board) {
    let clues = 0;
    for (let i = 0; i < 81; i++) if (board[i]) clues++;
    return clues;
  }

  /*
   * Backtracking search over a copy of `board`, filling the empty cell with the fewest
   * candidates first and trying digits in `order`. Stops after `limit` solutions.
   * Returns how many were found plus the first one.
   */
  function search(board, limit, order) {
    const cells = Uint8Array.from(board);
    const rows = new Uint16Array(9);
    const cols = new Uint16Array(9);
    const boxes = new Uint16Array(9);

    for (let i = 0; i < 81; i++) {
      if (!cells[i]) continue;
      const bit = 1 << (cells[i] - 1);
      rows[rowOf(i)] |= bit;
      cols[colOf(i)] |= bit;
      boxes[boxOf(i)] |= bit;
    }

    let count = 0;
    let first = null;

    (function step() {
      let cell = -1, options = 0, fewest = 10;
      for (let i = 0; i < 81; i++) {
        if (cells[i]) continue;
        const free = FULL & ~(rows[rowOf(i)] | cols[colOf(i)] | boxes[boxOf(i)]);
        if (!free) return;                        // dead end
        const n = POPCOUNT[free];
        if (n < fewest) {
          fewest = n;
          cell = i;
          options = free;
          if (n === 1) break;
        }
      }
      if (cell === -1) {                          // board full: a solution
        count++;
        if (!first) first = Array.from(cells);
        return;
      }

      const r = rowOf(cell), c = colOf(cell), b = boxOf(cell);
      for (const digit of order) {
        const bit = 1 << (digit - 1);
        if (!(options & bit)) continue;
        cells[cell] = digit;
        rows[r] |= bit;
        cols[c] |= bit;
        boxes[b] |= bit;
        step();
        cells[cell] = 0;
        rows[r] ^= bit;
        cols[c] ^= bit;
        boxes[b] ^= bit;
        if (count >= limit) return;
      }
    })();

    return { count: count, first: first };
  }

  /*
   * Fill a random grid, then dig clues out, keeping a removal only while exactly one
   * solution remains. Easy/medium remove mirrored pairs for a tidy layout.
   */
  function generate(level) {
    const target = TARGET_CLUES[level];
    const solution = search(new Uint8Array(81), 1, shuffle(DIGITS.slice())).first;
    const puzzle = solution.slice();
    const symmetric = level === "easy" || level === "medium";

    for (const cell of shuffle(Array.from({ length: 81 }, (_, i) => i))) {
      const clues = countClues(puzzle);
      if (clues <= target) break;
      if (!puzzle[cell]) continue;

      const twin = 80 - cell;
      const group = symmetric && twin !== cell && puzzle[twin] ? [cell, twin] : [cell];
      if (clues - group.length < target) continue;

      for (const i of group) puzzle[i] = 0;
      if (search(puzzle, 2, DIGITS).count === 1) continue;   // still unique: keep the gap
      for (const i of group) puzzle[i] = solution[i];        // ambiguous: put clues back
    }

    return {
      clues: countClues(puzzle),
      puzzle: Array.from(puzzle),
      solution: Array.from(solution)
    };
  }

  return { generate: generate, units: UNITS };
})();
</script>

<script>
/* Board, input and game state. */
(function () {
  "use strict";

  const board = document.getElementById("board");
  const timerEl = document.getElementById("timer");
  const cluesEl = document.getElementById("clues");
  const statusEl = document.getElementById("status");
  const levels = document.getElementById("levels");
  const pad = document.getElementById("pad");
  const notesBtn = document.getElementById("notesBtn");
  const autoBtn = document.getElementById("autoBtn");

  const cells = [];
  for (let i = 0; i < 81; i++) {
    const el = document.createElement("div");
    el.className = "cell";
    el.setAttribute("role", "gridcell");

    const value = document.createElement("span");
    value.className = "value";

    const notesEl = document.createElement("div");
    notesEl.className = "notes";
    const noteEls = Array.from({ length: 9 }, (_, n) => {
      const span = document.createElement("span");
      span.textContent = String(n + 1);
      notesEl.appendChild(span);
      return span;
    });

    el.append(value, notesEl);
    cells.push({ el: el, value: value, noteEls: noteEls });
    board.appendChild(el);
  }

  // Every cell that shares a row, column or box with each cell — used for highlighting.
  const peers = Array.from({ length: 81 }, () => new Set());
  for (const unit of Sudoku.units) {
    for (const a of unit) for (const b of unit) if (a !== b) peers[a].add(b);
  }

  let level = "easy";
  let puzzle = [];                        // clue values, 0 where the player writes
  let solution = [];                      // the full grid
  let values = [];                        // what is on the board now
  let notes = new Array(81).fill(0);      // pencil marks as a bitmask per cell
  let excluded = new Array(81).fill(0);   // candidates the player crossed off auto notes
  let selected = null;
  let notesMode = false;
  let autoNotes = false;                  // show derived candidates instead of manual marks
  let locked = false;                     // solved or revealed: read-only board
  let flagged = new Set();                // cells the last Check found wrong
  let startedAt = 0;
  let ticker = null;

  const ALL_DIGITS = 0x1ff;

  // Digits that can still legally go in a cell, derived from the board on every render.
  function candidates(i) {
    let used = 0;
    for (const p of peers[i]) {
      const v = values[p];
      if (v) used |= 1 << (v - 1);
    }
    return ALL_DIGITS & ~used;
  }

  function formatTime(ms) {
    const total = Math.max(0, Math.floor(ms / 1000));
    return String(Math.floor(total / 60)).padStart(2, "0") + ":" + String(total % 60).padStart(2, "0");
  }

  function setStatus(text, tone) {
    statusEl.textContent = text;
    statusEl.className = "status" + (tone ? " " + tone : "");
  }

  function syncNotesButtons() {
    notesBtn.setAttribute("aria-pressed", String(notesMode));
    autoBtn.setAttribute("aria-pressed", String(autoNotes));
  }

  // Notes mode edits the marks; auto notes decides whether they are derived or hand-written.
  function setNotesMode(on) {
    notesMode = on;
    syncNotesButtons();
    render();
  }

  function setAutoNotes(on) {
    autoNotes = on;
    syncNotesButtons();
    render();
  }

  function render() {
    const bad = new Set();
    for (const unit of Sudoku.units) {
      const seen = new Map();
      for (const i of unit) {
        const v = values[i];
        if (!v) continue;
        if (seen.has(v)) {
          bad.add(i);
          bad.add(seen.get(v));
        } else {
          seen.set(v, i);
        }
      }
    }
    for (const i of flagged) bad.add(i);

    const focusValue = selected === null ? 0 : values[selected];

    for (let i = 0; i < 81; i++) {
      const cell = cells[i];
      const value = values[i];
      let marks = 0;
      if (!value) marks = autoNotes ? candidates(i) & ~excluded[i] : notes[i];

      cell.el.classList.toggle("is-given", puzzle[i] !== 0);
      cell.el.classList.toggle("is-user", puzzle[i] === 0 && value !== 0);
      cell.el.classList.toggle("is-selected", selected === i);
      cell.el.classList.toggle("is-peer", selected !== null && peers[selected].has(i));
      cell.el.classList.toggle("is-same", focusValue !== 0 && value === focusValue && selected !== i);
      cell.el.classList.toggle("is-bad", bad.has(i));
      cell.el.classList.toggle("has-notes", marks !== 0);

      cell.value.textContent = value ? String(value) : "";
      cell.noteEls.forEach((span, n) => {
        span.className = marks & (1 << n) ? "on" : "";
      });
    }
  }

  // Freeze the clock, lock the board and report why.
  function finish(message, tone) {
    locked = true;
    clearInterval(ticker);
    ticker = null;
    timerEl.textContent = formatTime(Date.now() - startedAt);
    setStatus(message, tone);
    render();
  }

  function newPuzzle() {
    const generated = Sudoku.generate(level);
    puzzle = generated.puzzle;
    solution = generated.solution;
    values = puzzle.slice();
    notes = new Array(81).fill(0);
    excluded = new Array(81).fill(0);
    flagged = new Set();
    selected = null;
    locked = false;
    notesMode = false;
    syncNotesButtons();
    cluesEl.textContent = String(generated.clues);
    setStatus("");
    render();

    clearInterval(ticker);
    startedAt = Date.now();
    timerEl.textContent = "00:00";
    ticker = setInterval(() => {
      timerEl.textContent = formatTime(Date.now() - startedAt);
    }, 250);
  }

  function place(digit) {
    if (locked || selected === null || puzzle[selected]) return;
    const i = selected;

    if (notesMode) {
      const bit = 1 << (digit - 1);
      if (autoNotes) {
        // Only legal candidates can be toggled, so a mark never contradicts the board.
        if (!values[i] && (candidates(i) & bit)) excluded[i] ^= bit;
      } else if (!values[i]) {
        notes[i] ^= bit;
      }
    } else {
      values[i] = values[i] === digit ? 0 : digit;
      if (values[i]) notes[i] = 0;
    }

    flagged.delete(i);
    render();

    if (values.every((v, n) => v === solution[n])) {
      finish("Solved in " + formatTime(Date.now() - startedAt) + ". Nice work.", "good");
    }
  }

  function erase() {
    if (locked || selected === null || puzzle[selected]) return;
    values[selected] = 0;
    notes[selected] = 0;
    excluded[selected] = 0;
    flagged.delete(selected);
    render();
  }

  function check() {
    if (locked) return;
    flagged = new Set();
    let filled = 0;
    values.forEach((value, i) => {
      if (!value) return;
      filled++;
      if (!puzzle[i] && value !== solution[i]) flagged.add(i);
    });
    render();

    const wrong = flagged.size;
    if (wrong) setStatus(wrong + (wrong === 1 ? " cell is" : " cells are") + " wrong.", "bad");
    else setStatus("No mistakes so far — " + (81 - filled) + " cells to go.", "good");
  }

  function reveal() {
    if (locked) return;
    values = solution.slice();
    flagged = new Set();
    finish("Solution revealed. Press New puzzle for a fresh grid.");
  }

  function move(dr, dc) {
    if (selected === null) return;
    const row = Math.min(8, Math.max(0, Math.floor(selected / 9) + dr));
    const col = Math.min(8, Math.max(0, (selected % 9) + dc));
    selected = row * 9 + col;
    render();
  }

  board.addEventListener("click", (event) => {
    const el = event.target.closest(".cell");
    if (!el) return;
    selected = [...board.children].indexOf(el);
    board.focus({ preventScroll: true });
    render();
  });

  board.addEventListener("keydown", (event) => {
    const key = event.key;
    if (/^[1-9]$/.test(key)) place(Number(key));
    else if (key === "Backspace" || key === "Delete" || key === "0") erase();
    else if (key === "n" || key === "N") setNotesMode(!notesMode);
    else if (key === "ArrowUp") move(-1, 0);
    else if (key === "ArrowDown") move(1, 0);
    else if (key === "ArrowLeft") move(0, -1);
    else if (key === "ArrowRight") move(0, 1);
    else return;
    event.preventDefault();
  });

  pad.addEventListener("click", (event) => {
    const btn = event.target.closest("button");
    if (!btn) return;
    if (btn.dataset.digit) place(Number(btn.dataset.digit));
    else if (btn.dataset.action === "notes") setNotesMode(!notesMode);
    else if (btn.dataset.action === "auto") setAutoNotes(!autoNotes);
    else erase();
  });

  levels.addEventListener("click", (event) => {
    const btn = event.target.closest("button[data-level]");
    if (!btn) return;
    level = btn.dataset.level;
    for (const other of levels.children) other.classList.toggle("is-active", other === btn);
    newPuzzle();
  });

  document.getElementById("new").addEventListener("click", newPuzzle);
  document.getElementById("check").addEventListener("click", check);
  document.getElementById("solve").addEventListener("click", reveal);

  newPuzzle();
})();
</script>
</body>
</html>
